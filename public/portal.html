<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>if (localStorage.getItem('emptracker-theme') === 'dark') document.documentElement.setAttribute('data-theme','dark');</script>
  <style>
    body { min-height: 100vh; background: var(--bg); }
    .portal-login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .portal-login-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 40px; width: 420px; max-width: 95vw;
      box-shadow: var(--shadow-lg); border-top: 3px solid var(--primary);
    }
    .portal-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .portal-logo-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      box-shadow: var(--glow-p);
    }
    .portal-logo-text { font-family: 'Plus Jakarta Sans','Inter',sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .portal-logo-text span { color: var(--primary); }
    .portal-logo-sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .portal-submit {
      width: 100%; padding: 13px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      color: #fff; font-size: 0.9rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all 0.2s; box-shadow: 0 4px 16px rgba(79,70,229,0.3);
    }
    .portal-submit:hover { box-shadow: 0 6px 24px rgba(79,70,229,0.45); transform: translateY(-1px); }

    /* ── Dashboard layout ── */
    #portalDash { display: none; padding: 24px; max-width: 960px; margin: 0 auto; }
    .pd-topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    .pd-topbar-logo { display: flex; align-items: center; gap: 10px; }
    .pd-topbar-logo-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .pd-topbar-title { font-family: 'Plus Jakarta Sans','Inter',sans-serif; font-size: 1rem; font-weight: 700; color: var(--text); }
    .pd-topbar-right { display: flex; align-items: center; gap: 12px; }
    .pd-name { font-family: 'Plus Jakarta Sans','Inter',sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .pd-role { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }
    .pd-logout-btn {
      font-size: 0.78rem; color: var(--muted); cursor: pointer; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
      font-family: inherit; transition: all 0.15s;
    }
    .pd-logout-btn:hover { color: var(--danger); border-color: var(--danger); }

    /* Stats row */
    .pd-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .pd-stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .pd-stat-lbl { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 8px; }
    .pd-stat-val { font-family: 'Space Grotesk','Inter',sans-serif; font-size: 1.35rem; font-weight: 700; color: var(--text); letter-spacing: -0.4px; }
    .pd-stat-sub { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
    .pd-stat.accent { border-color: var(--primary); background: var(--primary-light); }
    .pd-stat.accent .pd-stat-val { color: var(--primary); }

    /* Two-column body */
    .pd-body { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
    @media (max-width: 720px) { .pd-body { grid-template-columns: 1fr; } }

    .pd-section-title {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
      color: var(--primary); margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1.5px solid var(--primary-light);
    }

    /* Calendar */
    .pd-cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .pd-cal-nav button { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; cursor: pointer; color: var(--text); font-family: inherit; font-size: 0.8rem; }
    .pd-cal-nav button:hover { border-color: var(--primary); color: var(--primary); }
    .pd-cal-month { font-weight: 700; font-size: 0.9rem; color: var(--text); }
    .pd-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .pd-cal-dow { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; color: var(--muted); text-align: center; padding: 4px 0; }
    .pd-cal-day {
      aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 600;
      color: var(--text-2); cursor: default; position: relative;
    }
    .pd-cal-day.empty { color: transparent; }
    .pd-cal-day.today { background: var(--primary); color: #fff; font-weight: 800; }
    .pd-cal-day.day-off { background: rgba(79,70,229,0.12); color: var(--primary); font-weight: 700; }
    .pd-cal-day.day-off::after {
      content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 50%; background: var(--primary);
    }
    .pd-cal-day.half-off { background: rgba(251,191,36,0.12); color: #d97706; }
    .pd-cal-day.half-off::after { background: #d97706; }
    .pd-cal-day.pending { background: rgba(156,163,175,0.1); color: var(--muted); }
    .pd-cal-day.pending::after { content: '⏳'; font-size: 8px; position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%); }

    /* Upcoming days off list */
    .pd-upcoming { margin-top: 16px; }
    .pd-upcoming-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; background: var(--bg); border-radius: 9px;
      margin-bottom: 6px; border: 1px solid var(--border);
    }
    .pd-upcoming-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
    .pd-upcoming-name { font-size: 0.82rem; font-weight: 600; color: var(--text); flex: 1; }
    .pd-upcoming-date { font-size: 0.75rem; color: var(--muted); }

    /* Holiday request form */
    .pd-right-panel { display: flex; flex-direction: column; gap: 16px; }
    .pd-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .pd-holiday-form .form-group { margin-bottom: 12px; }
    .pd-holiday-form .form-group label { font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 5px; }
    .pd-holiday-form input, .pd-holiday-form select, .pd-holiday-form textarea {
      width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.88rem; font-family: inherit; box-sizing: border-box;
    }
    .pd-holiday-form textarea { resize: vertical; }

    /* My requests list */
    .pd-req-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-radius: 9px; background: var(--bg);
      border: 1px solid var(--border); margin-bottom: 6px; gap: 8px;
    }
    .pd-req-date { font-size: 0.82rem; font-weight: 600; color: var(--text); }
    .pd-req-type { font-size: 0.72rem; color: var(--muted); }
    .pd-req-status { font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .pd-req-status.pending  { background: rgba(251,191,36,0.15); color: #d97706; }
    .pd-req-status.approved { background: rgba(34,197,94,0.12);  color: #16a34a; }
    .pd-req-status.denied   { background: rgba(239,68,68,0.12);  color: #dc2626; }
  </style>
</head>
<body>

  <!-- ── LOGIN ── -->
  <div class="portal-login-wrap" id="portalLoginWrap">
    <div class="portal-login-card">
      <div class="portal-logo">
        <div class="portal-logo-icon">👤</div>
        <div>
          <div class="portal-logo-text">Emp<span>Tracker</span></div>
          <div class="portal-logo-sub">Employee Self-Service Portal</div>
        </div>
      </div>
      <div id="portalError" class="alert alert-error hidden" style="margin-bottom:16px"></div>
      <div class="form-group" style="margin-bottom:14px">
        <label style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);display:block;margin-bottom:5px">Employee ID</label>
        <input type="number" id="portalEmpId" placeholder="Your employee number" style="width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:0.9rem;font-family:inherit">
      </div>
      <div class="form-group" style="margin-bottom:24px">
        <label style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);display:block;margin-bottom:5px">PIN</label>
        <input type="password" id="portalPin" placeholder="Your PIN" maxlength="6" inputmode="numeric" style="width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:0.9rem;font-family:inherit"
          onkeydown="if(event.key==='Enter') portalLogin()">
      </div>
      <button class="portal-submit" onclick="portalLogin()">Access My Portal →</button>
      <p style="text-align:center;margin-top:16px;font-size:0.72rem;color:var(--muted)">Contact your manager for your Employee ID and PIN</p>
    </div>
  </div>

  <!-- ── DASHBOARD ── -->
  <div id="portalDash">
    <div class="pd-topbar">
      <div class="pd-topbar-logo">
        <div class="pd-topbar-logo-icon">👤</div>
        <div class="pd-topbar-title">Emp<span style="color:var(--primary)">Tracker</span> <span style="font-weight:400;color:var(--muted)">· Self-Service Portal</span></div>
      </div>
      <div class="pd-topbar-right">
        <div>
          <div class="pd-name" id="pdName"></div>
          <div class="pd-role" id="pdRole"></div>
        </div>
        <button class="pd-logout-btn" onclick="portalLogout()">Sign Out</button>
      </div>
    </div>

    <!-- Stats row -->
    <div class="pd-stats" id="pdStats"></div>

    <!-- Main body -->
    <div class="pd-body">
      <!-- Left: calendar + upcoming -->
      <div>
        <div class="pd-section-title">Team Calendar — Days Off</div>
        <div class="pd-cal-nav">
          <button onclick="calNav(-1)">← Prev</button>
          <span class="pd-cal-month" id="pdCalMonth"></span>
          <button onclick="calNav(1)">Next →</button>
        </div>
        <div class="pd-cal-grid" id="pdCalGrid"></div>

        <div class="pd-upcoming" id="pdUpcoming"></div>
      </div>

      <!-- Right: request form + my requests -->
      <div class="pd-right-panel">
        <div class="pd-card pd-holiday-form">
          <div class="pd-section-title">Request Time Off</div>
          <div id="holidayMsg" class="alert hidden" style="margin-bottom:12px"></div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="holidayDate">
          </div>
          <div class="form-group">
            <label>Type</label>
            <select id="holidayType">
              <option value="full">Full Day</option>
              <option value="half">Half Day</option>
            </select>
          </div>
          <div class="form-group">
            <label>Note (optional)</label>
            <textarea id="holidayNote" rows="2" placeholder="Reason or note…"></textarea>
          </div>
          <button class="portal-submit" onclick="submitHoliday()">Submit Request</button>
        </div>

        <div class="pd-card">
          <div class="pd-section-title">My Requests</div>
          <div id="myRequests"><div style="font-size:0.8rem;color:var(--muted)">Loading…</div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let portalSession = null;
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth() + 1;
    let calDaysOff = [];

    function pesc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function portalLogin() {
      const id  = document.getElementById('portalEmpId').value.trim();
      const pin = document.getElementById('portalPin').value.trim();
      const err = document.getElementById('portalError');
      err.classList.add('hidden');
      if (!id || !pin) { err.textContent = 'Please enter your ID and PIN.'; err.classList.remove('hidden'); return; }
      const res = await fetch('/api/portal/auth', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employee_id: id, pin })
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error || 'Login failed'; err.classList.remove('hidden'); return; }
      portalSession = { id, pin, ...data };
      renderDash();
    }

    async function renderDash() {
      const e = portalSession;
      document.getElementById('portalLoginWrap').style.display = 'none';
      document.getElementById('portalDash').style.display = 'block';
      document.getElementById('pdName').textContent = e.name;
      document.getElementById('pdRole').textContent = [e.job_title, e.department].filter(Boolean).join(' · ') || (e.employment_type === 'self_employed' ? 'Self-Employed' : 'Payroll');

      const sym = e.currency === 'AED' ? 'AED ' : (e.currency === 'EUR' ? '€' : (e.currency === 'USD' ? '$' : '£'));
      const gross = parseFloat(e.annual_salary) || 0;
      const monthly = gross / 12;
      const allowance = e.employment_type === 'self_employed' ? 5 : 20;

      // Fetch days off used this year
      let daysUsed = '—';
      try {
        const yr = new Date().getFullYear();
        const drRes = await fetch(`/api/portal/calendar?employee_id=${e.id}&pin=${encodeURIComponent(e.pin)}&year=${yr}&month=all_year`);
        const drData = await drRes.json();
        if (drData.days_off) {
          daysUsed = drData.days_off
            .filter(d => d.employee_id == e.id)
            .reduce((sum, d) => sum + parseFloat(d.is_day_off), 0);
        }
      } catch {}

      document.getElementById('pdStats').innerHTML = `
        <div class="pd-stat accent">
          <div class="pd-stat-lbl">Annual Salary</div>
          <div class="pd-stat-val">${sym}${gross.toLocaleString('en-GB',{maximumFractionDigits:0})}</div>
          <div class="pd-stat-sub">Gross / year</div>
        </div>
        <div class="pd-stat">
          <div class="pd-stat-lbl">Monthly Gross</div>
          <div class="pd-stat-val">${sym}${monthly.toLocaleString('en-GB',{maximumFractionDigits:0})}</div>
          <div class="pd-stat-sub">Before deductions</div>
        </div>
        <div class="pd-stat">
          <div class="pd-stat-lbl">Days Off Used</div>
          <div class="pd-stat-val">${typeof daysUsed === 'number' ? daysUsed : '—'} <span style="font-size:0.9rem;color:var(--muted)">/ ${allowance}</span></div>
          <div class="pd-stat-sub">This year</div>
        </div>
        <div class="pd-stat">
          <div class="pd-stat-lbl">Employee Type</div>
          <div class="pd-stat-val" style="font-size:1rem">${e.employment_type === 'self_employed' ? 'Self-Employed' : 'Payroll'}</div>
          <div class="pd-stat-sub">Since ${e.start_date || '—'}</div>
        </div>
      `;

      // Pre-fill tomorrow
      const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
      document.getElementById('holidayDate').value = tomorrow.toISOString().slice(0,10);

      renderCalendar();
      loadMyRequests();
    }

    async function renderCalendar() {
      document.getElementById('pdCalMonth').textContent =
        new Date(calYear, calMonth - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

      try {
        const res = await fetch(`/api/portal/calendar?employee_id=${portalSession.id}&pin=${encodeURIComponent(portalSession.pin)}&year=${calYear}&month=${calMonth}`);
        const data = await res.json();
        calDaysOff = data.days_off || [];

        const daysOffMap = {};
        calDaysOff.forEach(d => {
          const day = parseInt(d.record_date.split('-')[2]);
          if (!daysOffMap[day]) daysOffMap[day] = [];
          daysOffMap[day].push(d);
        });

        // Grid
        const firstDow = new Date(calYear, calMonth - 1, 1).getDay();
        const startOffset = (firstDow === 0 ? 6 : firstDow - 1);
        const daysInMonth = new Date(calYear, calMonth, 0).getDate();
        const today = new Date();
        const isThisMonth = today.getFullYear() === calYear && (today.getMonth() + 1) === calMonth;

        let html = ['Mo','Tu','We','Th','Fr','Sa','Su'].map(d => `<div class="pd-cal-dow">${d}</div>`).join('');
        for (let i = 0; i < startOffset; i++) html += `<div class="pd-cal-day empty"></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const dow = (startOffset + d - 1) % 7;
          const isWeekend = dow >= 5;
          const isToday = isThisMonth && d === today.getDate();
          const offs = daysOffMap[d] || [];
          let cls = 'pd-cal-day';
          let tip = '';
          if (isToday && !offs.length) cls += ' today';
          if (offs.length) {
            const hasHalf = offs.some(o => parseFloat(o.is_day_off) === 0.5);
            cls += hasHalf ? ' half-off' : ' day-off';
            tip = offs.map(o => `${o.employee_name}${parseFloat(o.is_day_off) === 0.5 ? ' (½)' : ''}`).join(', ');
          }
          const style = isWeekend && !offs.length ? 'opacity:0.35' : '';
          html += `<div class="${cls}" style="${style}" title="${pesc(tip)}">${d}</div>`;
        }
        document.getElementById('pdCalGrid').innerHTML = html;

        // Upcoming
        const upcoming = data.upcoming || [];
        if (!upcoming.length) {
          document.getElementById('pdUpcoming').innerHTML = '';
        } else {
          document.getElementById('pdUpcoming').innerHTML = `
            <div class="pd-section-title" style="margin-top:20px">Upcoming Days Off</div>
            ${upcoming.map(u => {
              const dt = new Date(u.record_date);
              const dateStr = dt.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
              const typeStr = parseFloat(u.is_day_off) === 0.5 ? '½ day' : 'Full day';
              return `<div class="pd-upcoming-item">
                <div class="pd-upcoming-dot"></div>
                <div class="pd-upcoming-name">${pesc(u.employee_name)}</div>
                <div class="pd-upcoming-date">${dateStr} · ${typeStr}</div>
              </div>`;
            }).join('')}
          `;
        }
      } catch (e) {
        document.getElementById('pdCalGrid').innerHTML = '<div style="color:var(--muted);font-size:0.8rem;padding:12px">Failed to load calendar</div>';
      }
    }

    function calNav(dir) {
      calMonth += dir;
      if (calMonth > 12) { calMonth = 1; calYear++; }
      if (calMonth < 1)  { calMonth = 12; calYear--; }
      renderCalendar();
    }

    async function loadMyRequests() {
      // We use the calendar endpoint which doesn't expose request status —
      // instead show a "no history endpoint yet" placeholder or fetch from a portal-specific route
      const container = document.getElementById('myRequests');
      // Fetch pending requests for this employee (reuse holiday-requests but filtered)
      // Since we don't have a portal-specific history route yet, show a helpful note
      container.innerHTML = `<div style="font-size:0.8rem;color:var(--muted)">Submitted requests are sent to your manager for approval. Approved dates will appear on the calendar above.</div>`;
    }

    async function submitHoliday() {
      const msg = document.getElementById('holidayMsg');
      msg.classList.add('hidden');
      const date = document.getElementById('holidayDate').value;
      const type = document.getElementById('holidayType').value;
      const note = document.getElementById('holidayNote').value.trim();
      if (!date) { msg.className = 'alert alert-error'; msg.textContent = 'Please select a date.'; msg.classList.remove('hidden'); return; }
      const res = await fetch('/api/portal/holiday-request', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employee_id: portalSession.id, pin: portalSession.pin, date, type, note })
      });
      const data = await res.json();
      if (res.ok) {
        msg.className = 'alert alert-success';
        msg.textContent = `✓ Request submitted for ${date}. Your manager has been notified.`;
        document.getElementById('holidayNote').value = '';
      } else {
        msg.className = 'alert alert-error';
        msg.textContent = data.error || 'Failed to submit.';
      }
      msg.classList.remove('hidden');
    }

    function portalLogout() {
      portalSession = null;
      calDaysOff = [];
      document.getElementById('portalLoginWrap').style.display = 'flex';
      document.getElementById('portalDash').style.display = 'none';
      document.getElementById('portalEmpId').value = '';
      document.getElementById('portalPin').value = '';
    }
  </script>
</body>
</html>
